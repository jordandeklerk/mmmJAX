[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "mmmjax"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Jordan DeKlerk", email = "jordan.deklerk@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dynamic = ["version", "description"]
dependencies = [
    "jax>=0.10.0,<0.11",
    "jaxtyping>=0.2.36",
]

[tool.flit.module]
name = "mmmjax"

[project.urls]
source = "https://github.com/jordandeklerk/mmmJAX"
tracker = "https://github.com/jordandeklerk/mmmJAX/issues"
documentation = "https://mmmjax.readthedocs.io"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
]
doc = [
    "sphinx>=8,<9",
    "sphinx-immaterial>=0.13.9",
    "myst-parser[linkify]>=5.0",
    "myst-nb>=1.4",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.7",
    "ipython",
]
dev = [
    "prek",
    "ruff>=0.16.4",
    "mypy",
    "ty",
    # NumPy 2.5 stubs require Python 3.12 syntax, while mypy checks our Python 3.11 floor.
    "numpy>=2.0,<2.5",
]
gpu = [
    "jax[cuda12]>=0.10.0,<0.11",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "E",   # Pycodestyle
    "W",   # Pycodestyle
    "D",   # pydocstyle
    "NPY", # numpy specific rules
    "UP",  # pyupgrade
    "I",   # isort
    "B",   # bugbear
    "BLE", # blind-except
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "D203", # one-blank-line-before-class
    "D213", # multi-line-summary-second-line
    "F722", # jaxtyping shape strings are forward-annotation syntax errors to pyflakes
]

[tool.ruff.lint.per-file-ignores]
"mmmjax/__init__.py" = ["I", "F401", "E402", "F403"]
"mmmjax/**/__init__.py" = ["I", "F401", "E402", "F403"]
"tests/**/*" = ["D", "E402"]

[tool.ruff.lint.isort]
known-third-party = ["jax", "jaxtyping", "numpy", "scipy"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = false

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
warn_unused_configs = true
pretty = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["mmmjax", "mmmjax.*"]
disallow_untyped_defs = true

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["mmmjax"]
branch = true

[tool.coverage.report]
show_missing = true
